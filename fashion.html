<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Fashion | Kiki Shutters</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0d0d0d;
      color: #f5f2ed;
      font-family: Arial, sans-serif;
    }

    header {
      padding: 25px 6%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #292929;
    }

    .logo {
      font-size: 18px;
      letter-spacing: 4px;
    }

    .back {
      color: #aaa;
      font-size: 12px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    main {
      padding: 90px 6%;
    }

    .label {
      color: #777;
      font-size: 11px;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 15px;
    }

    h1 {
      font-family: Georgia, serif;
      font-size: clamp(50px, 8vw, 100px);
      font-weight: normal;
      margin-bottom: 60px;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .gallery img {
      width: 100%;
      height: 500px;
      display: block;
      object-fit: cover;
      background: #181818;
      cursor: pointer;
    }

    footer {
      padding: 30px 6%;
      color: #666;
      font-size: 12px;
      border-top: 1px solid #292929;
    }

    .lightbox {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.95);
      z-index: 9999;
      align-items: center;
      justify-content: center;
    }

    .lightbox img {
      max-width: 90%;
      max-height: 90vh;
      width: auto;
      height: auto;
      object-fit: contain;
    }

    .close-lightbox,
    .prev,
    .next {
      position: absolute;
      color: white;
      cursor: pointer;
      z-index: 10000;
    }

    .close-lightbox {
      top: 20px;
      right: 30px;
      font-size: 40px;
    }

    .prev {
      left: 20px;
      font-size: 50px;
    }

    .next {
      right: 20px;
      font-size: 50px;
    }

    @media (max-width: 650px) {
      .gallery {
        grid-template-columns: 1fr;
      }

      .gallery img {
        height: 400px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="logo">KIKI SHUTTERS</div>

  <a href="index.html" class="back">
    ← Back to Portfolio
  </a>
</header>

<main>

  <div class="label">Selected Work</div>

  <h1>Fashion</h1>

  <div class="gallery">
    <img src="IMG_0420.jpg2.jpg" alt="Fashion photography by Kiki Shutters" onclick="openLightbox(0)">
    <img src="IMG_0520.jpg" alt="Fashion photography by Kiki Shutters" onclick="openLightbox(1)">
    <img src="IMG_0385.jpg21.jpg" alt="Fashion photography by Kiki Shutters" onclick="openLightbox(2)">
    <img src="IMG_0510.jpg" alt="Fashion photography by Kiki Shutters" onclick="openLightbox(3)">
  </div>

</main>

<footer>
  © 2026 Kiki Shutters · Ibadan, Nigeria
</footer>

<div class="lightbox" id="lightbox">
  <span class="close-lightbox" onclick="closeLightbox()">×</span>
  <span class="prev" onclick="changeImage(-1)">‹</span>
  <img id="lightbox-img" src="">
  <span class="next" onclick="changeImage(1)">›</span>
</div>

<script>
const images = [
  "IMG_0420.jpg2.jpg",
  "IMG_0520.jpg",
  "IMG_0385.jpg21.jpg",
  "IMG_0510.jpg"
];

let currentImage = 0;

function openLightbox(index) {
  currentImage = index;
  document.getElementById("lightbox-img").src = images[currentImage];
  document.getElementById("lightbox").style.display = "flex";
}

function closeLightbox() {
  document.getElementById("lightbox").style.display = "none";
}

function changeImage(direction) {
  currentImage = (currentImage + direction + images.length) % images.length;
  document.getElementById("lightbox-img").src = images[currentImage];
}
</script>

</body>
</html>
