.gallery {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 20px;
}

.gallery img {
  width: 100%;
  height: 520px;
  object-fit: cover;
  display: block;
  cursor: pointer;
}

/* TABLET */
@media (min-width: 701px) and (max-width: 1024px) {
  .gallery {
    grid-template-columns: repeat(2, 1fr);
    gap: 15px;
  }

  .gallery img {
    height: 450px;
  }
}

/* MOBILE */
@media (max-width: 700px) {
  .gallery {
    grid-template-columns: 1fr;
