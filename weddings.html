<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weddings | Kiki Shutters</title>

  <style>
    .lightbox {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.96);
  z-index: 9999;
  align-items: center;
  justify-content: center;
}

.lightbox.active {
  display: flex;
}

.lightbox img {
  max-width: 90%;
  max-height: 90vh;
  object-fit: contain;
}

.lightbox-close {
  position: absolute;
  top: 25px;
  right: 35px;
  color: white;
  font-size: 38px;
  cursor: pointer;
  z-index: 10001;
}

.lightbox-prev,
.lightbox-next {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  color: white;
  font-size: 45px;
  cursor: pointer;
  padding: 20px;
  z-index: 10001;
}

.lightbox-prev {
  left: 20px;
}

.lightbox-next {
  right: 20px;
}
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0d0d0d;
      color: #f5f2ed;
      font-family: Arial, sans-serif;
    }

    header {
      padding: 25px 6%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #292929;
    }

    .logo {
      font-size: 18px;
      letter-spacing: 4px;
    }

    .back {
      color: #aaa;
      font-size: 12px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    main {
      padding: 90px 6%;
    }

    .label {
      color: #777;
      font-size: 11px;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 15px;
    }

    h1 {
      font-family: Georgia, serif;
      font-size: clamp(50px, 8vw, 100px);
      font-weight: normal;
      margin-bottom: 60px;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
    }
.gallery img {
  width: 100%;
  height: 520px;
  object-fit: cover;
  display: block;
  cursor: pointer;
}

    .empty {
      color: #777;
      padding: 80px 20px;
      border: 1px solid #292929;
      text-align: center;
      grid-column: 1 / -1;
    }

    footer {
      padding: 30px 6%;
      color: #666;
      font-size: 12px;
      border-top: 1px solid #292929;
    }

    @media (max-width: 650px) {
    .gallery {
    grid-template-columns: 1fr;
    gap: 15px;
  }

  .gallery img {
    height: 500px;
  }
}

    }
  </style>
</head>

<body>

<header>
  <div class="logo">KIKI SHUTTERS</div>

  <a href="index.html" class="back">
    ← Back to Portfolio
  </a>
</header>

<main>

  <div class="label">Selected Work</div>

  <h1>Weddings</h1>

  <div class="gallery">
    <img src="IMG_8864.jpg" alt="Wedding photography by Kiki Shutters" onclick="openLightbox(0)">
<img src="IMG_8889.jpg-2.jpg" alt="Wedding photography by Kiki Shutters" onclick="openLightbox(1)">
<img src="IMG_8896.jpg2.jpg" alt="Wedding photography by Kiki Shutters" onclick="openLightbox(2)">
<img src="IMG_8905.jpg" alt="Wedding photography by Kiki Shutters" onclick="openLightbox(3)">
<img src="IMG_9023.jpg" alt="Wedding photography by Kiki Shutters" onclick="openLightbox(5)">
<img src="IMG_9046.jpg" alt="Wedding photography by Kiki Shutters" onclick="openLightbox(6)">
<img src="IMG_9100.jpg" alt="Wedding photography by Kiki Shutters" onclick="openLightbox(8)">
<img src="IMG_9086.jpg" alt="Wedding photography by Kiki Shutters" onclick="openLightbox(7)">
<img src="IMG_8995.jpg" alt="Wedding photography by Kiki Shutters" onclick="openLightbox(4)">
<img src="IMG_9122.jpgre.jpg" alt="Wedding photography by Kiki Shutters" onclick="openLightbox(9)">
<img src="IMG_8430.jpg" alt="Wedding photography by Kiki Shutters" onclick="openLightbox(11)">
<img src="IMG_8435.jpg" alt="Wedding photography by Kiki Shutters" onclick="openLightbox(12)">
<img src="IMG_8441.jpg" alt="Wedding photography by Kiki Shutters" onclick="openLightbox(13)">

   </div> 

</main>

<footer>
  © 2026 Kiki Shutters · Ibadan, Nigeria
</footer>
<div class="lightbox" id="lightbox">

  <span class="lightbox-close" onclick="closeLightbox()">×</span>

  <span class="lightbox-prev" onclick="previousImage()">‹</span>

  <img id="lightboxImage" src="" alt="Wedding photography">

  <span class="lightbox-next" onclick="nextImage()">›</span>

</div>
  <script>
  const weddingImages = [
    "IMG_8864.jpg",
    "IMG_8889.jpg-2.jpg",
    "IMG_8896.jpg2.jpg",
    "IMG_8905.jpg",
    "IMG_8995.jpg",
    "IMG_9023.jpg",
    "IMG_9046.jpg",
    "IMG_9086.jpg",
    "IMG_9100.jpg",
    "IMG_9122.jpgre.jpg",
    "IMG_9177.jpgre.jpg"
  "IMG_8430.jpg",
  "IMG_8435.jpg",
  "IMG_8441.jpg",
  "IMG_8448.jpg",
  "IMG_8460.jpg"
  "IMG_8359.jpg",
  ];

  let currentImage = 0;

  const lightbox = document.getElementById("lightbox");
  const lightboxImage = document.getElementById("lightboxImage");

  function openLightbox(index) {
    currentImage = index;
    lightboxImage.src = weddingImages[currentImage];
    lightbox.classList.add("active");
    document.body.style.overflow = "hidden";
  }

  function closeLightbox() {
    lightbox.classList.remove("active");
    document.body.style.overflow = "";
  }

  function nextImage() {
    currentImage = (currentImage + 1) % weddingImages.length;
    lightboxImage.src = weddingImages[currentImage];
  }

  function previousImage() {
    currentImage =
      (currentImage - 1 + weddingImages.length) % weddingImages.length;

    lightboxImage.src = weddingImages[currentImage];
  }

  document.addEventListener("keydown", function(event) {
    if (!lightbox.classList.contains("active")) return;

    if (event.key === "ArrowRight") nextImage();
    if (event.key === "ArrowLeft") previousImage();
    if (event.key === "Escape") closeLightbox();
  });

  lightbox.addEventListener("click", function(event) {
    if (event.target === lightbox) {
      closeLightbox();
    }
  });
</script>
</body>
</html>
