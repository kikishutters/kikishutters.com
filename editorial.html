<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Editorial | Kiki Shutters</title>

 <style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    background: #0d0d0d;
    color: #f5f2ed;
    font-family: Arial, sans-serif;
  }

  header {
    padding: 25px 6%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid #292929;
  }

  .logo {
    font-size: 18px;
    letter-spacing: 4px;
  }

  .back {
    color: #aaa;
    font-size: 12px;
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  main {
    padding: 90px 6%;
  }

  .label {
    color: #777;
    font-size: 11px;
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 15px;
  }

  h1 {
    font-family: Georgia, serif;
    font-size: clamp(50px, 8vw, 100px);
    font-weight: normal;
    margin-bottom: 60px;
  }

  .gallery {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 20px;
  }

  .gallery img {
    width: 100%;
    height: 520px;
    object-fit: cover;
    display: block;
    cursor: pointer;
  }

  .empty {
    color: #777;
    padding: 80px 20px;
    border: 1px solid #292929;
    text-align: center;
    grid-column: 1 / -1;
  }

  footer {
    padding: 30px 6%;
    color: #666;
    font-size: 12px;
    border-top: 1px solid #292929;
  }

  /* LIGHTBOX */
  .lightbox {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.96);
    z-index: 9999;
    align-items: center;
    justify-content: center;
  }

  .lightbox.active {
    display: flex;
  }

  .lightbox img {
    max-width: 90%;
    max-height: 90vh;
    object-fit: contain;
    user-select: none;
  }

  .lightbox-close {
    position: absolute;
    top: 25px;
    right: 35px;
    color: white;
    font-size: 38px;
    font-weight: 200;
    cursor: pointer;
    z-index: 10001;
  }

  .lightbox-prev,
  .lightbox-next {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    color: white;
    font-size: 45px;
    cursor: pointer;
    user-select: none;
    padding: 20px;
    z-index: 10001;
  }

  .lightbox-prev {
    left: 20px;
  }

  .lightbox-next {
    right: 20px;
  }

  .lightbox-prev:hover,
  .lightbox-next:hover,
  .lightbox-close:hover {
    opacity: 0.6;
  }

  @media (max-width: 700px) {
    .gallery {
      grid-template-columns: 1fr;
      gap: 15px;
    }

    .gallery img {
      height: 500px;
    }

    .lightbox img {
      max-width: 94%;
      max-height: 85vh;
    }

    .lightbox-prev,
    .lightbox-next {
      font-size: 32px;
      padding: 15px;
    }

    .lightbox-prev {
      left: 0;
    }

    .lightbox-next {
      right: 0;
    }

    .lightbox-close {
      top: 15px;
      right: 20px;
      font-size: 32px;
    }
  }
</style>
    }
  </style>
</head>

<body>

<header>
  <div class="logo">KIKI SHUTTERS</div>

  <a href="index.html" class="back">
    ← Back to Portfolio
  </a>
</header>

<main>

  <div class="label">Selected Work</div>

  <h1>Editorial</h1>

<div class="gallery">
  <img src="IMG_2578.jpg" alt="Editorial photography by Kiki Shutters" onclick="openLightbox(0)">
  <img src="IMG_2579.jpg" alt="Editorial photography by Kiki Shutters" onclick="openLightbox(1)">
  <img src="IMG_2586.jpgcopy.jpg" alt="Editorial photography by Kiki Shutters" onclick="openLightbox(2)">
  <img src="IMG_2587.jpg" alt="Editorial photography by Kiki Shutters" onclick="openLightbox(3)">
</div>

    <div class="empty">
   
    </div>

  </div>

</main>

<footer>
  © 2026 Kiki Shutters · Ibadan, Nigeria
</footer>

</body>
</html>
